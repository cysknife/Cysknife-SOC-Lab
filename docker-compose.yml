version: '3.8'

services:
  # SIEM Server (Splunk or Wazuh)
  siem-server:
    image: splunk/splunk:latest
    container_name: cysknife-siem
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=Password123!
    ports:
      - "8000:8000"  # Splunk Web
      - "8089:8089"  # Splunk API
    volumes:
      - ./configs/splunk:/opt/splunk/etc/apps/search/local
      - ./data/logs:/opt/splunk/var/log/splunk
    networks:
      - soc-lab-network
    restart: unless-stopped

  # Vulnerable Web Application (OWASP WebGoat)
  vulnerable-web:
    image: webgoat/webgoat:latest
    container_name: cysknife-webgoat
    ports:
      - "8080:8080"
    networks:
      - soc-lab-network
    restart: unless-stopped

  # Log Generator & Attack Simulator
  log-generator:
    build:
      context: .
      dockerfile: Dockerfile.log-generator
    container_name: cysknife-loggen
    environment:
      - SIEM_IP=siem-server
      - SIEM_PORT=9997
    volumes:
      - ./scripts:/scripts
      - ./data/logs:/logs
    networks:
      - soc-lab-network
    restart: unless-stopped

  # Endpoint Monitoring (Wazuh Agent Example)
  endpoint-agent:
    image: wazuh/wazuh-agent:4.5.5
    container_name: cysknife-endpoint
    environment:
      - WAZUH_MANAGER_IP=siem-server
    networks:
      - soc-lab-network
    restart: unless-stopped

  # Packet Capture (Wireshark/TShark Container)
  packet-capture:
    image: alpine:latest
    container_name: cysknife-pcap
    install_packages:
      - tshark
      - tcpdump
    volumes:
      - ./data/pcaps:/pcaps
    networks:
      - soc-lab-network
    restart: unless-stopped

networks:
  soc-lab-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16