<!-- Wazuh basic configuration for Cysknife Lab -->
<ossec_config>
  <global>
    <jsonout>yes</jsonout>
    <child_level>10</child_level>
  </global>

  <rules>
    <include>/var/ossec/etc/rules/local_rules.xml</include>
  </rules>

  <syscheck>
    <disabled>no</disabled>
    <check_freq>3600</check_freq>
    <scan_on_start>yes</scan_on_start>
  </syscheck>

  <alerts>
    <log_alert>yes</log_alert>
  </alerts>
</ossec_config>